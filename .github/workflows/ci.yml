name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript tests
        run: node index.test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests
        run: python test_anchor_safe_pay.py
