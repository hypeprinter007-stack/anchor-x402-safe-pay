name: Publish to PyPI

# One-time setup: on PyPI, add a Trusted Publisher for project
# "anchor-x402-safe-pay" pointing at this repo + workflow (publish-pypi.yml),
# environment "pypi". No API token needed after that.

# Manual until the PyPI Trusted Publisher is configured (see note above).
# Once it is, switch this back to `push: { tags: ["v*"] }` so a version tag
# publishes npm + PyPI together.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - run: python -m pip install --upgrade build
      - run: python test_anchor_safe_pay.py
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
